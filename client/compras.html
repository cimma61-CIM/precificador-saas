<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compras</title>
<link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body data-app-page="compras">

<main class="main-content">
  <div class="container">
    <div class="page-stack">
      <div class="page-header">
        <div>
          <h1>Compras</h1>
          <p>Registre suas compras vinculadas a contatos (fornecedores).</p>
        </div>
      </div>

      <div class="card">
        <form id="form-compra" class="form-grid">
          <input id="compra-id" type="hidden">
          <div id="compra-info" class="field hidden" style="grid-column: span 2;">
            <strong>Editando compra:</strong> <span id="compra-info-text"></span>
          </div>
          <div class="field">
            <label for="data">Data da compra</label>
            <input id="data" type="date" required>
          </div>
          <div class="field">
            <label for="contato">Fornecedor</label>
            <select id="contato" required>
              <option value="">Selecione um fornecedor</option>
            </select>
          </div>
          <div class="field">
            <label for="produto">Produto</label>
            <select id="produto">
              <option value="">Selecione um produto</option>
            </select>
          </div>
          <div class="field">
            <label for="quantidade-item">Quantidade</label>
            <input id="quantidade-item" type="number" min="1" value="1">
          </div>
          <div class="field">
            <label for="custo-item">Custo</label>
            <input id="custo-item" type="number" step="0.01" min="0.01">
          </div>
          <div class="field" style="grid-column: span 2; display: flex; justify-content: flex-end;">
            <button id="adicionar-item-btn" type="button" class="button-secondary">Adicionar item</button>
          </div>
          <div class="field" style="grid-column: span 2; display: flex; justify-content: space-between; align-items: center;">
            <button id="cancelar-edicao-btn" type="button" class="button-secondary hidden">Cancelar edição</button>
            <button type="submit" class="button-primary">Salvar compra</button>
          </div>
        </form>

        <div id="compras-feedback" class="feedback"></div>
      </div>

      <div id="itens-compra-card" class="card hidden">
        <h2>Itens da compra</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Custo</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-itens-compra">
              <tr><td colspan="4">Nenhum item adicionado.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card table-card">
        <div class="toolbar">
          <input id="busca-compra" class="search-input" placeholder="Buscar compras por fornecedor...">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Fornecedor</th>
                <th>Fornecedor ID</th>
                <th>Itens</th>
              </tr>
            </thead>
            <tbody id="tabela-compras">
              <tr><td colspan="4">Carregando compras...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/theme.js"></script>
<script src="/js/app-api.js"></script>
<script src="/js/app-layout.js"></script>
<script src="/js/compras.js"></script>

</body>
</html>
