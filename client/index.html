<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Precificador SaaS</title>
<link rel="stylesheet" href="/css/style.css">
<style>
body{
margin:0;
font-family:Arial;
background:#f3f4f6;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.auth-wrapper{
width:min(920px, 100%);
display:grid;
grid-template-columns:repeat(2, minmax(0, 1fr));
gap:24px;
padding:24px;
}

.auth-card{
background:#fff;
padding:24px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.auth-card h2{
margin-top:0;
}

.auth-card input{
display:block;
width:100%;
margin:0 0 12px;
box-sizing:border-box;
}

.auth-card button{
width:100%;
}

.mensagem{
min-height:24px;
margin-top:12px;
color:#b91c1c;
}

.auth-link{
display:inline-block;
margin-top:8px;
color:#2563eb;
text-decoration:none;
}

.auth-link:hover{
text-decoration:underline;
}

@media (max-width: 768px){
  .auth-wrapper{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Entrar</h2>
    <form id="login-form">
      <input id="login-email" type="email" placeholder="Email">
      <input id="login-senha" type="password" placeholder="Senha" data-password-toggle>
      <button type="submit">Entrar</button>
    </form>
    <a class="auth-link" href="/esqueci-senha.html">Esqueci minha senha</a>
    <div id="login-mensagem" class="mensagem"></div>
  </div>

  <div class="auth-card">
    <h2>Criar conta</h2>
    <form id="register-form">
      <input id="register-nome" placeholder="Nome">
      <input id="register-email" type="email" placeholder="Email">
      <input id="register-senha" type="password" placeholder="Senha" data-password-toggle>
      <button type="submit">Cadastrar</button>
    </form>
    <div id="register-mensagem" class="mensagem"></div>
  </div>
</div>

<script src="/js/password-toggle.js"></script>
<script>
if (localStorage.getItem("token")) {
  window.location.href = "/dashboard.html"
}

async function enviar(url, payload) {
  const resposta = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  })

  const dados = await resposta.json()

  if (!resposta.ok) {
    throw new Error(dados.erro || "Erro na requisicao")
  }

  return dados
}

async function login() {
  const mensagem = document.getElementById("login-mensagem")
  mensagem.textContent = ""

  try {
    const dados = await enviar("/auth/login", {
      email: document.getElementById("login-email").value,
      senha: document.getElementById("login-senha").value
    })

    localStorage.setItem("token", dados.token)
    localStorage.setItem("usuario", JSON.stringify(dados.usuario))
    window.location.href = "/dashboard.html"
  } catch (error) {
    mensagem.textContent = error.message
  }
}

async function register() {
  const mensagem = document.getElementById("register-mensagem")
  mensagem.textContent = ""

  try {
    const dados = await enviar("/auth/register", {
      nome: document.getElementById("register-nome").value,
      email: document.getElementById("register-email").value,
      senha: document.getElementById("register-senha").value
    })

    localStorage.setItem("token", dados.token)
    localStorage.setItem("usuario", JSON.stringify(dados.usuario))
    window.location.href = "/dashboard.html"
  } catch (error) {
    mensagem.textContent = error.message
  }
}

document
  .getElementById("login-form")
  .addEventListener("submit", function (event) {
    event.preventDefault()
    login()
  })

document
  .getElementById("register-form")
  .addEventListener("submit", function (event) {
    event.preventDefault()
    register()
  })
</script>

</body>
</html>
