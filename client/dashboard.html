<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Precificador SaaS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <h2>Precificador</h2>
      <span>Painel de gestão para marketplaces</span>
    </div>

    <nav class="menu">
      <a href="#" class="active" onclick="carregarPagina('resumo.html', this)">Dashboard</a>
      <a href="#" onclick="carregarPagina('produtos.html', this)">Produtos</a>
      <a href="#" onclick="carregarPagina('marketplaces.html', this)">Marketplaces</a>
      <a href="#" onclick="carregarPagina('taxas.html', this)">Taxas Marketplace</a>
      <a href="#" onclick="logout()">Sair</a>
    </nav>
  </aside>

  <main class="content">
    <div class="content-header">
      <div>
        <h1>Painel</h1>
        <p>Acompanhe indicadores, configure marketplaces e atualize seus preços.</p>
      </div>
    </div>

    <div class="frame-shell">
      <iframe id="conteudo" src="resumo.html?v=20260311-3"></iframe>
    </div>
  </main>
</div>

<script>
if (!localStorage.getItem("token")) {
  window.location.href = "/"
}

function carregarPagina(pagina, link){
  document.getElementById("conteudo").src = `${pagina}?v=20260311-3`
  document
    .querySelectorAll(".menu a")
    .forEach((item) => item.classList.remove("active"))

  if (link) {
    link.classList.add("active")
  }
}

function logout() {
  localStorage.removeItem("token")
  localStorage.removeItem("usuario")
  window.location.href = "/"
}
</script>

</body>
</html>
