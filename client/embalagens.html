<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embalagens</title>
<link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body data-app-page="embalagens">

<main class="main-content">
  <div class="container">
    <div class="page-stack">
      <div class="page-header">
        <div>
          <h1>Embalagens</h1>
          <p>Cadastre embalagens com peso e dimensões para futuro cálculo de frete.</p>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <h2>Nova embalagem</h2>
          <button type="button" class="button-primary" id="nova-embalagem-button">Nova embalagem</button>
        </div>
        <p class="card-subtitle">Adicione embalagens para usar no cálculo de logística.</p>

        <form id="embalagem-form" class="hidden">
          <input id="embalagem-id" type="hidden">

          <div class="form-grid">
            <div class="field">
              <label for="embalagem-nome">Nome</label>
              <input id="embalagem-nome" required placeholder="Ex.: Caixa pequena">
            </div>
            <div class="field">
              <label for="embalagem-peso">Peso (kg)</label>
              <input id="embalagem-peso" required placeholder="Ex.: 0.500" type="number" step="0.001" min="0.001">
            </div>
            <div class="field">
              <label for="embalagem-largura">Largura (cm)</label>
              <input id="embalagem-largura" required placeholder="Ex.: 20.00" type="number" step="0.01" min="0.01">
            </div>
            <div class="field">
              <label for="embalagem-altura">Altura (cm)</label>
              <input id="embalagem-altura" required placeholder="Ex.: 10.00" type="number" step="0.01" min="0.01">
            </div>
            <div class="field">
              <label for="embalagem-comprimento">Comprimento (cm)</label>
              <input id="embalagem-comprimento" required placeholder="Ex.: 30.00" type="number" step="0.01" min="0.01">
            </div>
            <div class="field field-checkbox">
              <label for="embalagem-ativo">
                <input id="embalagem-ativo" type="checkbox" checked>
                Ativo
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="button-primary">Salvar embalagem</button>
            <button type="button" class="button-secondary" id="embalagem-cancelar-button">Cancelar</button>
          </div>
        </form>

        <div id="embalagens-feedback" class="feedback"></div>
      </div>

      <div class="card table-card">
        <div class="toolbar">
          <input id="embalagens-busca" class="search-input" placeholder="Buscar embalagem por nome">
          <label class="checkbox-label">
            <input id="embalagens-include-inativos" type="checkbox">
            Mostrar inativos
          </label>
          <button type="button" class="button-secondary" id="embalagens-atualizar-button">Atualizar</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Peso (kg)</th>
                <th>Dimensões (cm)</th>
                <th>Volume (cm³)</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="embalagens-tabela">
              <tr>
                <td colspan="6">Carregando embalagens...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="table-footer" id="embalagens-paginacao"></div>
      </div>
    </div>
  </div>
</main>

<script src="/js/theme.js"></script>
<script src="/js/app-api.js"></script>
<script src="/js/app-layout.js"></script>
<script src="/js/embalagens.js"></script>

</body>
</html>
