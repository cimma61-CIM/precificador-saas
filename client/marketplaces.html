<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Marketplaces</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">
  <div class="page-stack">
    <div class="page-header">
      <div>
        <h1>Marketplaces</h1>
        <p>Gerencie o catálogo de canais usados nas taxas e nos produtos.</p>
      </div>
    </div>

    <div class="card">
      <h2>Novo marketplace</h2>
      <p class="card-subtitle">Cadastre apenas uma vez cada canal de venda.</p>

      <form id="marketplace-form">
        <div class="form-grid">
          <div class="field">
            <label for="marketplace-nome">Nome do marketplace</label>
            <input id="marketplace-nome" placeholder="Ex.: Mercado Livre" required>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="button-primary">Salvar Marketplace</button>
        </div>
      </form>

      <div id="marketplace-feedback" class="feedback"></div>
    </div>

    <div class="card table-card">
      <div class="section-head">
        <div>
          <h2>Marketplaces cadastrados</h2>
          <p class="card-subtitle">Lista oficial usada no cadastro de taxas e produtos.</p>
        </div>
        <button type="button" class="button-secondary" onclick="loadMarketplaces()">Atualizar</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Slug</th>
            </tr>
          </thead>
          <tbody id="marketplaces-tabela"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/js/marketplaces.js"></script>

</body>
</html>
