<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categorias</title>
<link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body data-app-page="categorias">

<main class="main-content">
  <div class="container">
    <div class="page-stack">
      <div class="page-header">
        <div>
          <h1>Categorias</h1>
          <p>Gerencie as categorias dos produtos em uma tela simples e direta.</p>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <h2>Nova categoria</h2>
          <button type="button" class="button-primary" id="nova-categoria-toggle">Nova categoria</button>
        </div>
        <p class="card-subtitle">Crie categorias para organizar a listagem de produtos.</p>

        <form id="categoria-form" class="hidden">
          <div class="form-grid">
            <div class="field">
              <label for="categoria-nome">Nome</label>
              <input id="categoria-nome" required placeholder="Ex.: Eletronicos">
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="button-primary">Salvar categoria</button>
            <button type="button" class="button-secondary" id="categoria-cancelar-button">Cancelar</button>
          </div>
        </form>

        <div id="categorias-feedback" class="feedback"></div>
      </div>

      <div class="card table-card">
        <div class="toolbar">
          <input id="categorias-busca" class="search-input" placeholder="Buscar categoria por nome">
          <button type="button" class="button-secondary" id="categorias-atualizar-button">Atualizar</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Criada em</th>
                <th>Acoes</th>
              </tr>
            </thead>
            <tbody id="categorias-tabela">
              <tr>
                <td colspan="3">Carregando categorias...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/theme.js"></script>
<script src="/js/app-api.js"></script>
<script src="/js/app-layout.js"></script>
<script src="/js/categorias.js"></script>

</body>
</html>
