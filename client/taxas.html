<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Taxas Marketplace</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">
  <div class="page-stack">
    <div class="page-header">
      <div>
        <h1>Taxas Marketplace</h1>
        <p>Configure custos variáveis por canal para sustentar a precificação automática.</p>
      </div>
    </div>

    <div class="card">
      <h2>Nova taxa</h2>
      <p class="card-subtitle">Defina comissão, frete médio e imposto por marketplace.</p>

      <form id="taxa-form">
        <input type="hidden" id="taxa-id">

        <div class="form-grid">
          <div class="field">
            <label for="marketplace-id">Marketplace</label>
            <select id="marketplace-id" required>
              <option value="">Selecione um marketplace</option>
            </select>
          </div>
          <div class="field">
            <label for="taxa-percentual">Taxa percentual</label>
            <input id="taxa-percentual" type="number" step="0.0001" placeholder="Ex.: 0.16" required>
          </div>
          <div class="field">
            <label for="taxa-fixa">Taxa fixa</label>
            <input id="taxa-fixa" type="number" step="0.01" placeholder="Ex.: 2.50" required>
          </div>
          <div class="field">
            <label for="frete-medio">Frete médio</label>
            <input id="frete-medio" type="number" step="0.01" placeholder="Ex.: 8.00 (opcional)">
          </div>
          <div class="field">
            <label for="imposto-percentual">Imposto percentual</label>
            <input id="imposto-percentual" type="number" step="0.0001" placeholder="Ex.: 0.08" required>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-button" class="button-primary">Salvar Taxa</button>
          <button type="button" class="button-secondary" onclick="cancelEdit()">Cancelar edição</button>
        </div>
      </form>

      <div id="feedback" class="feedback"></div>
    </div>

    <div class="card table-card">
      <div class="section-head">
        <div>
          <h2>Taxas cadastradas</h2>
          <p class="card-subtitle">Tabela base para cálculo e recálculo de preços.</p>
        </div>
        <button type="button" class="button-secondary" onclick="loadTaxas()">Atualizar</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Marketplace</th>
              <th>Taxa %</th>
              <th>Taxa fixa</th>
              <th>Frete médio</th>
              <th>Imposto</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="taxas-tabela"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/js/taxas.js"></script>

</body>
</html>
