<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anúncios</title>
<link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body data-app-page="anuncios">

<main class="main-content">
  <div class="container">
    <div class="page-stack">
      <div class="page-header">
        <div>
          <h1>Anúncios</h1>
          <p>Cadastre e gerencie anúncios com produto, marketplace, estoque e status.</p>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <h2>Novo anúncio</h2>
          <button type="button" class="button-primary" id="novo-anuncio-button">Novo anúncio</button>
        </div>
        <p class="card-subtitle">Use o formulário para criar e editar anúncios vinculados a produto e marketplace.</p>

        <form id="anuncio-form" class="hidden">
          <input id="anuncio-id" type="hidden">

          <div class="form-grid">
            <div class="field">
              <label for="anuncio-produto">Produto</label>
              <select id="anuncio-produto" required></select>
            </div>
            <div class="field">
              <label for="anuncio-marketplace">Marketplace</label>
              <select id="anuncio-marketplace" required></select>
            </div>
            <div class="field">
              <label for="anuncio-sku">SKU do anúncio</label>
              <input id="anuncio-sku" required placeholder="Ex.: PROD-001">
            </div>
            <div class="field">
              <label for="anuncio-titulo">Título</label>
              <input id="anuncio-titulo" placeholder="Ex.: Campanha de verão">
            </div>
            <div class="field">
              <label for="anuncio-preco">Preço</label>
              <input id="anuncio-preco" required type="number" step="0.01" min="0.01" placeholder="0.00">
            </div>
            <div class="field">
              <label for="anuncio-estoque">Estoque</label>
              <input id="anuncio-estoque" required type="number" step="1" min="0" placeholder="0">
            </div>
            <div class="field">
              <label for="anuncio-status">Status</label>
              <select id="anuncio-status" required>
                <option value="ativo">Ativo</option>
                <option value="pausado">Pausado</option>
                <option value="sem_estoque">Sem estoque</option>
              </select>
            </div>
            <div class="field field-checkbox">
              <label for="anuncio-tem-ads">
                <input id="anuncio-tem-ads" type="checkbox">
                Ads
              </label>
            </div>
            <div class="field field-checkbox">
              <label for="anuncio-full">
                <input id="anuncio-full" type="checkbox">
                Full
              </label>
            </div>
            <div class="field field-checkbox">
              <label for="anuncio-em-promocao">
                <input id="anuncio-em-promocao" type="checkbox">
                Promoção
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="button-primary">Salvar anúncio</button>
            <button type="button" class="button-secondary" id="anuncio-cancelar-button">Cancelar</button>
          </div>
        </form>

        <div id="anuncios-feedback" class="feedback"></div>
      </div>

      <div class="card table-card">
        <div class="toolbar">
          <input id="anuncios-busca" class="search-input" placeholder="Buscar por SKU, título ou produto">
          <select id="anuncios-filtro-status" class="filter-select">
            <option value="">Todos os status</option>
            <option value="ativo">Ativo</option>
            <option value="pausado">Pausado</option>
            <option value="sem_estoque">Sem estoque</option>
          </select>
          <select id="anuncios-filtro-marketplace" class="filter-select"></select>
          <button type="button" class="button-secondary" id="anuncios-atualizar-button">Atualizar</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Marketplace</th>
                <th>SKU</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Status</th>
                <th>Ads</th>
                <th>Full</th>
                <th>Promoção</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="anuncios-tabela">
              <tr>
                <td colspan="10">Carregando anúncios...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="table-footer" id="anuncios-paginacao"></div>
      </div>
    </div>
  </div>
</main>

<script src="/js/theme.js"></script>
<script src="/js/app-api.js"></script>
<script src="/js/app-layout.js"></script>
<script src="/js/marketplaces-source.js"></script>
<script src="/js/anuncios.js"></script>

</body>
</html>
